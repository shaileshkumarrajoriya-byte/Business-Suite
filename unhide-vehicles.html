<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unhide Vehicles Tool</title>
<style>
  body{ font-family: sans-serif; padding: 16px; background:#FBF9F4; color:#2B2E33; max-width:720px; margin:0 auto; }
  h2{ font-family: serif; }
  button.primary{ background:#3E8161; color:#fff; border:none; padding:12px 18px; border-radius:8px; font-size:1rem; cursor:pointer; }
  #log{ white-space:pre-wrap; background:#111; color:#0f0; padding:10px; border-radius:8px; font-family:monospace; font-size:0.8rem; margin-top:16px; }
</style>
</head>
<body>
<h2>Unhide Vehicles Tool</h2>
<p>Ye tool Vehicle Expense Tracker ki "hidden vehicles" list saaf kar deta hai, taaki koi bhi vehicle chhupi hui na rahe. Kisi ka data delete nahi hota.</p>
<button class="primary" onclick="runFix()">Sabhi Vehicles Wapas Dikhayein</button>
<div id="log">Ready.</div>

<script>
const FIREBASE_DB_URL = 'https://van-register-default-rtdb.asia-southeast1.firebasedatabase.app';
function log(msg){
  document.getElementById('log').textContent += '\n' + msg;
}
async function runFix(){
  try{
    log('Fetching expenseData...');
    const res = await fetch(`${FIREBASE_DB_URL}/expenseData.json`);
    const json = await res.json();
    const expenseData = JSON.parse(json.value);
    log('Current hidden list: ' + JSON.stringify(expenseData.hiddenVehicles || []));
    expenseData.hiddenVehicles = [];
    const saveRes = await fetch(`${FIREBASE_DB_URL}/expenseData.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value: JSON.stringify(expenseData) })
    });
    if(!saveRes.ok) throw new Error('Save failed');
    log('✅ DONE. Hidden list cleared — all 6 vehicles should show now.');
    alert('Ho gaya! Vehicle Expenses app ko band karke dobara kholein.');
  }catch(e){
    log('ERROR: ' + e.message);
  }
}
</script>
</body>
</html>
