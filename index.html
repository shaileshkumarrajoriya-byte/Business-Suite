<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Business Suite">

<link rel="apple-touch-icon" href="icon-192.png">
<title>Shree Maa Narmada — Business Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #141414;
    --ink-dark: #000000;
    --paper: #FBF9F4;
    --paper-line: #E7E1D3;
    --brass: #C9A227;
    --brass-deep: #8A6B14;
    --brass-light: #F0D488;
    --paid: #3F7859;
    --due: #B23B31;
    --text: #2B2E33;
    --muted: #6B7280;
    /* premium tokens */
    --brass-glow: rgba(201,162,39,0.35);
    --shadow-card: 0 1px 2px rgba(20,15,5,0.05), 0 14px 32px rgba(20,15,5,0.09);
    --shadow-lift: 0 10px 24px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.08);
    --radius-card: 22px;
    --ease: cubic-bezier(.22,.9,.32,1.1);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{ height:100%; }
  body{
    margin:0; background: var(--paper); color: var(--text);
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  input, textarea{ user-select:text; }

  header{
    background:
      radial-gradient(ellipse 480px 200px at 12% -30%, rgba(201,162,39,0.20), transparent 60%),
      linear-gradient(180deg, rgba(20,20,20,0.92) 0%, rgba(10,10,10,0.90) 100%);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    color:#fff; padding: calc(10px + env(safe-area-inset-top)) 14px 8px;
    border-bottom: 1px solid rgba(201,162,39,0.4);
    box-shadow: 0 1px 0 rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.18);
    position:fixed; top:0; left:0; right:0; z-index:20;
    transition: transform 0.3s var(--ease);
  }
  header::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background: linear-gradient(90deg, transparent, var(--brass-light), transparent);
    opacity:0.55;
  }
  .header-top-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .header-top-row button{
    background:rgba(255,255,255,0.15); border:none; color:#fff;
    width:32px; height:32px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition: transform 0.1s ease, background 0.15s ease;
  }
  .header-top-row button:active{ transform: scale(0.9); background:rgba(255,255,255,0.25); }
  header .tab-title{
    flex:1; text-align:center; font-size:0.92rem; font-weight:700;
    color:#F0E4C4; letter-spacing:2.2px; text-transform:uppercase;
    font-family:'Bitter', serif;
    text-shadow: 0 1px 3px rgba(0,0,0,0.35);
  }
  .header-bottom-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:6px; font-size:0.74rem; font-weight:600; color:#F0E4C4; opacity:0.85;
  }
  .header-bottom-row #liveDay{ opacity:0.95; letter-spacing:0.5px; }

  #offlineBanner, #installBanner{
    position:fixed; left:0; right:0; z-index:19;
    display:none; align-items:center; justify-content:center; gap:10px;
    padding:8px 14px; font-size:0.78rem; font-weight:600; text-align:center;
  }
  #offlineBanner{ background:#B23B31; color:#fff; }
  #offlineBanner.show{ display:flex; }
  #installBanner{
    background: linear-gradient(160deg, var(--brass) 0%, var(--brass-deep) 100%); color:#fff;
    justify-content:space-between;
  }
  #installBanner.show{ display:flex; }
  #installBanner button{
    background:rgba(255,255,255,0.22); border:none; color:#fff; border-radius:6px;
    padding:5px 10px; font-size:0.75rem; font-weight:700; cursor:pointer; flex-shrink:0;
  }
  #dismissInstallBtn{ background:transparent !important; padding:5px !important; font-size:0.85rem !important; }

  .frame-wrap{
    position:fixed; left:0; right:0;
    top: var(--header-h, 92px);
    bottom: var(--nav-h, 64px);
    overflow:hidden;
    transition: top 0.3s ease, bottom 0.3s ease;
  }
  .frame-wrap iframe{
    position:absolute; inset:0; width:100%; height:100%; border:none;
    background: var(--paper);
  }
  .frame-wrap iframe.hidden{ display:none; }

  @keyframes tabFadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
  .tab-enter{ animation: tabFadeIn 0.28s ease; }

  .placeholder{
    position:absolute; inset:0; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px; background:var(--paper);
  }
  .placeholder.show{ display:flex; }
  .placeholder .icon{ font-size:3rem; margin-bottom:14px; }
  .placeholder h3{ font-family:'Bitter',serif; color:var(--ink-dark); margin:0 0 6px; }
  .placeholder p{ color:var(--muted); font-size:0.88rem; max-width:280px; }

  /* ============ Frame loading / error states ============ */
  .frame-status{
    position:absolute; inset:0; z-index:5; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:12px;
    text-align:center; padding:30px; background:var(--paper);
  }
  .frame-status.show{ display:flex; }
  .frame-spinner{
    width:36px; height:36px; border-radius:50%;
    border:3px solid var(--paper-line); border-top-color:var(--brass-deep);
    animation: frameSpin 0.8s linear infinite;
  }
  @keyframes frameSpin{ to{ transform:rotate(360deg); } }
  .frame-status .fs-text{ color:var(--muted); font-size:0.85rem; }
  .frame-status .fs-error-icon{ font-size:2.6rem; }
  .frame-status .fs-retry{
    background: linear-gradient(160deg, var(--brass) 0%, var(--brass-deep) 100%);
    color:#fff; border:none; border-radius:12px; padding:10px 20px;
    font-weight:600; font-size:0.85rem; cursor:pointer; margin-top:2px;
    box-shadow: 0 4px 12px rgba(138,107,20,0.3);
    transition: transform 0.1s ease;
  }
  .frame-status .fs-retry:active{ transform: scale(0.96); }

  /* ============ Native Home launcher (the "map" of the suite) ============ */
  .home-screen{
    position:absolute; inset:0; overflow-y:auto; display:none;
    background: var(--paper); padding: 24px 16px calc(30px + env(safe-area-inset-bottom));
  }
  .home-screen.show{ display:block; }
  .hs-greeting{ text-align:center; margin-bottom:26px; position:relative; }
  .hs-greeting::after{
    content:''; display:block; width:36px; height:2px; margin:14px auto 0;
    background: linear-gradient(90deg, transparent, var(--brass-deep), transparent);
  }
  .hs-firm-name{ font-family:'Bitter',serif; font-weight:800; font-size:1.32rem; color:var(--ink-dark); letter-spacing:-0.2px; }
  .hs-date{ font-size:0.78rem; color:var(--muted); margin-top:5px; letter-spacing:0.3px; }
  .hs-section-label{
    font-size:0.7rem; font-weight:700; letter-spacing:1.8px; color:var(--brass-deep);
    text-transform:uppercase; margin: 0 4px 14px;
  }
  .hs-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap:14px; align-items:stretch;
  }
  .hs-card{
    background:#fff; border:1px solid rgba(20,15,5,0.06); border-radius:var(--radius-card);
    padding:19px 17px; text-align:left; cursor:pointer;
    display:flex; flex-direction:column; gap:11px;
    box-shadow: var(--shadow-card);
    font-family:inherit; position:relative; overflow:hidden;
    transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease), border-color 0.18s ease;
  }
  .hs-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background: linear-gradient(90deg, var(--brass-deep), var(--brass) 50%, var(--brass-light));
    opacity:0; transition: opacity 0.18s ease;
  }
  .hs-card:hover::before{ opacity:1; }
  .hs-card:active{
    transform: scale(0.965);
    box-shadow: 0 1px 2px rgba(20,15,5,0.06);
    border-color: var(--brass-glow);
  }
  .hs-card-icon{
    width:48px; height:48px; border-radius:15px; color:#E8C766;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(160deg, #2b2b2b 0%, #000 100%);
    border: 1px solid rgba(201,162,39,0.4);
    box-shadow: var(--shadow-lift);
    flex-shrink:0;
  }
  .hs-card-icon svg{ width:24px; height:24px; }
  .hs-card-label{ font-weight:700; color:var(--ink-dark); font-size:0.95rem; letter-spacing:-0.1px; font-family:'Bitter',serif; }
  .hs-card-sub{ font-size:0.73rem; color:var(--muted); margin-top:-7px; letter-spacing:0.2px; }
  .hs-card.wide{ grid-column: 1 / -1; flex-direction:row; align-items:center; }
  .hs-card.wide .hs-card-icon{ flex-shrink:0; }
  .hs-card.wide::before{ width:3px; height:100%; background: linear-gradient(180deg, var(--brass-deep), var(--brass) 50%, var(--brass-light)); }

  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background: rgba(255,253,247,0.88);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-top:1px solid rgba(201,162,39,0.22);
    display:flex; flex-direction:column;
    box-shadow: 0 -8px 24px rgba(20,15,5,0.08);
    transition: transform 0.3s var(--ease);
  }
  .nav-items-row{
    display:flex; justify-content:space-around; align-items:center;
    padding: 8px 0 3px;
  }
  .firm-info-strip{
    display:flex; align-items:center; justify-content:center; gap:10px;
    text-align:left; font-size:0.66rem; color:var(--muted);
    padding: 6px 10px calc(7px + env(safe-area-inset-bottom));
    border-top:1px solid var(--paper-line);
    line-height:1.5;
  }
  .firm-info-strip img{ height:28px; width:auto; flex-shrink:0; }
  .firm-info-strip .firm-name{ font-weight:700; color:var(--ink-dark); font-family:'Bitter',serif; font-size:0.78rem; }
  .bottom-nav-item{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:0.62rem; font-weight:700; letter-spacing:0.2px; padding:6px 10px;
    transition: color 0.15s ease, transform 0.12s ease;
  }
  .bottom-nav-item:active{ transform: scale(0.9); }
  .bottom-nav-item .nav-icon{ display:flex; transition: transform 0.2s var(--ease); }
  .bottom-nav-item .nav-icon svg{ width:21px; height:21px; }
  .bottom-nav-item.active{ color: var(--brass-deep); }
  .bottom-nav-item.active .nav-icon{ transform: translateY(-2px) scale(1.1); filter: drop-shadow(0 2px 4px var(--brass-glow)); }
  .bottom-nav-item.active::before{
    content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:18px; height:3px; border-radius:2px;
    background: linear-gradient(90deg, var(--brass-deep), var(--brass));
    box-shadow: 0 0 8px var(--brass-glow);
  }

  .field{ text-align:left; margin-bottom:12px; }
  label{ display:block; font-size:0.78rem; color:var(--muted); margin-bottom:4px; }
  input{
    width:100%; padding:10px 12px; border:1px solid var(--paper-line); border-radius:10px;
    font-size:0.95rem; font-family:inherit; box-sizing:border-box;
  }
  .btn{
    background: linear-gradient(160deg, var(--brass) 0%, var(--brass-deep) 100%);
    color:#fff; border:none; border-radius:10px; padding:11px 16px;
    font-weight:600; font-size:0.9rem; cursor:pointer; width:100%;
  }
</style>
</head>

<script>
// ---------- Tab switching (apps are embedded in this file — decoded on demand) ----------
const TAB_LABELS = { home:'Home', dashboard:'Dashboard', students:'Students', drivers:'Drivers', expenses:'Expenses', loans:'Loans' }; // icons themselves now live as inline SVG in the HTML, not here
const loadedFrames = {};
const frameLoadTimers = {};
const blobUrls = {}; // keeps object URLs around so they can be revoked on retry

function showFrameStatus(tab, mode){
  const el = document.getElementById('frame-status-' + tab);
  if(!el) return;
  if(mode === 'loading'){
    el.innerHTML = `<div class="frame-spinner"></div><div class="fs-text">${TAB_LABELS[tab] || 'App'} khul raha hai…</div>`;
    el.classList.add('show');
  } else if(mode === 'error'){
    el.innerHTML = `<div class="fs-error-icon">⚠️</div><div class="fs-text">${TAB_LABELS[tab] || 'App'} load nahi ho paya.</div><button class="fs-retry" type="button" onclick="retryFrame('${tab}')">Retry</button>`;
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

// Decodes this app's embedded (UTF-8-safe) base64 source and loads it into
// its iframe via a Blob URL — no network request needed for the app shell
// itself, since everything lives inside this one file.
function loadEmbeddedApp(tab){
  const srcEl = document.getElementById('src-' + tab);
  const frame = document.getElementById('frame-' + tab);
  if(!srcEl || !frame) return;
  try{
    const b64 = srcEl.textContent.trim();
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const html = new TextDecoder('utf-8').decode(bytes);
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    if(blobUrls[tab]) URL.revokeObjectURL(blobUrls[tab]);
    blobUrls[tab] = URL.createObjectURL(blob);
    frame.src = blobUrls[tab];
  }catch(e){
    console.error(e);
    showFrameStatus(tab, 'error');
  }
}

function retryFrame(tab){
  loadedFrames[tab] = false;
  showFrameStatus(tab, 'loading');
  armFrameTimeout(tab);
  loadEmbeddedApp(tab);
  loadedFrames[tab] = true;
}

function armFrameTimeout(tab){
  clearTimeout(frameLoadTimers[tab]);
  frameLoadTimers[tab] = setTimeout(()=>{ showFrameStatus(tab, 'error'); }, 6000);
}

// Wire up load/error handling once per iframe.
Object.keys(TAB_LABELS).filter(t=>t!=='home').forEach(tab=>{
  const frame = document.getElementById('frame-' + tab);
  if(!frame) return;
  frame.addEventListener('load', ()=>{
    clearTimeout(frameLoadTimers[tab]);
    showFrameStatus(tab, 'none');
  });
});

function activateTab(tab){
  document.querySelectorAll('.bottom-nav-item').forEach(b=>b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tabTitle').textContent = TAB_LABELS[tab] || '';

  document.querySelectorAll('.frame-wrap iframe').forEach(f=>f.classList.add('hidden'));
  document.querySelectorAll('.placeholder').forEach(p=>p.classList.remove('show'));
  document.getElementById('homeScreen').classList.remove('show');

  const animateIn = (el)=>{
    el.classList.remove('tab-enter');
    void el.offsetWidth; // force reflow so the animation restarts every time
    el.classList.add('tab-enter');
  };

  if(tab === 'home'){
    const home = document.getElementById('homeScreen');
    home.classList.add('show');
    animateIn(home);
    return;
  }

  const frame = document.getElementById('frame-' + tab);
  if(frame){
    if(!loadedFrames[tab]){
      showFrameStatus(tab, 'loading');
      armFrameTimeout(tab);
      loadEmbeddedApp(tab);
      loadedFrames[tab] = true;
    }
    frame.classList.remove('hidden');
    animateIn(frame);
  } else {
    const ph = document.getElementById('placeholder-' + tab);
    if(ph) ph.classList.add('show');
  }
}

document.getElementById('bottomNav').addEventListener('click', (e)=>{
  const btn = e.target.closest('.bottom-nav-item');
  if(!btn) return;
  activateTab(btn.dataset.tab);
});

// Home screen app cards jump straight to the matching tab.
document.getElementById('homeScreen').addEventListener('click', (e)=>{
  const card = e.target.closest('.hs-card');
  if(!card) return;
  activateTab(card.dataset.goto);
});

activateTab('home'); syncFrameOffsets();

// ---------- Keep frame offsets correct (header/bottom-nav always visible) ----------
function syncFrameOffsets(){
  const headerH = document.querySelector('header').offsetHeight;
  const navH = document.getElementById('bottomNav').offsetHeight;
  const offlineEl = document.getElementById('offlineBanner');
  const installEl = document.getElementById('installBanner');
  offlineEl.style.top = headerH + 'px';
  const offlineH = offlineEl.classList.contains('show') ? offlineEl.offsetHeight : 0;
  installEl.style.top = (headerH + offlineH) + 'px';
  const installH = installEl.classList.contains('show') ? installEl.offsetHeight : 0;
  document.documentElement.style.setProperty('--header-h', (headerH + offlineH + installH) + 'px');
  document.documentElement.style.setProperty('--nav-h', navH + 'px');
}
window.addEventListener('resize', syncFrameOffsets);

// ---------- Offline indicator ----------
function updateOfflineBanner(){
  document.getElementById('offlineBanner').classList.toggle('show', !navigator.onLine);
  syncFrameOffsets();
}
window.addEventListener('online', updateOfflineBanner);
window.addEventListener('offline', updateOfflineBanner);
updateOfflineBanner();

// ---------- "Add to Home Screen" install prompt ----------
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(navigator.onLine && localStorage.getItem('installBannerDismissed') !== 'true'){
    document.getElementById('installBanner').classList.add('show');
    syncFrameOffsets();
  }
});
document.getElementById('appRefreshBtn').addEventListener('click', ()=>{
  location.reload();
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
  syncFrameOffsets();
});
document.getElementById('dismissInstallBtn').addEventListener('click', ()=>{
  document.getElementById('installBanner').classList.remove('show');
  localStorage.setItem('installBannerDismissed', 'true');
  syncFrameOffsets();
});
window.addEventListener('appinstalled', ()=>{
  document.getElementById('installBanner').classList.remove('show');
  syncFrameOffsets();
});

// ---------- Firm info footer (pulled once from Van Register's data) ----------
async function loadFirmInfo(){
  const textEl = document.getElementById('firmInfoText');
  const logoEl = document.getElementById('firmLogo');
  try{
    const res = await fetch('https://van-register-default-rtdb.asia-southeast1.firebasedatabase.app/data.json');
    const data = await res.json();
    const parsed = data && data.value ? JSON.parse(data.value) : null;
    const biz = parsed && parsed.business;
    if(!biz || !biz.name){ textEl.textContent = ''; syncFrameOffsets(); return; }
    const parts = [];
    if(biz.regNo) parts.push('Reg No: ' + biz.regNo);
    if(biz.gst) parts.push('GSTIN: ' + biz.gst);
    if(biz.phone) parts.push('☎ ' + biz.phone);
    textEl.innerHTML = `<span class="firm-name">${biz.name}</span>` + (parts.length ? '<br>' + parts.join(' · ') : '');
    logoEl.style.display = 'block';
    document.getElementById('hsFirmName').textContent = biz.name;
  }catch(e){
    textEl.textContent = '';
  }
  syncFrameOffsets();
}
loadFirmInfo();

// ---------- Live time & date ----------
function updateClock(){
  const now = new Date();
  document.getElementById('liveTime').textContent = now.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  document.getElementById('liveDay').textContent = now.toLocaleDateString('en-IN', { weekday:'long' });
  document.getElementById('liveDate').textContent = now.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  document.getElementById('hsDate').textContent = now.toLocaleDateString('en-IN', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
}
updateClock();
setInterval(updateClock, 1000);
</script>
