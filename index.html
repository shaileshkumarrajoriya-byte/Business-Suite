<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Business Suite">
<link rel="manifest" href="manifest-suite-v3.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Shree Maa Narmada — Business Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #141414;
    --ink-dark: #000000;
    --paper: #FBF9F4;
    --paper-line: #E7E1D3;
    --brass: #C9A227;
    --brass-deep: #8A6B14;
    --brass-light: #F0D488;
    --paid: #3F7859;
    --due: #B23B31;
    --text: #2B2E33;
    --muted: #6B7280;
    /* premium tokens */
    --brass-glow: rgba(201,162,39,0.35);
    --shadow-card: 0 1px 2px rgba(20,15,5,0.05), 0 14px 32px rgba(20,15,5,0.09);
    --shadow-lift: 0 10px 24px rgba(0,0,0,0.30), inset 0 1px 0 rgba(255,255,255,0.08);
    --radius-card: 22px;
    --ease: cubic-bezier(.22,.9,.32,1.1);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{ height:100%; }
  body{
    margin:0; background: var(--paper); color: var(--text);
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  input, textarea{ user-select:text; }

  header{
    background:
      radial-gradient(ellipse 480px 200px at 12% -30%, rgba(201,162,39,0.20), transparent 60%),
      linear-gradient(180deg, rgba(20,20,20,0.92) 0%, rgba(10,10,10,0.90) 100%);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    color:#fff; padding: calc(10px + env(safe-area-inset-top)) 14px 8px;
    border-bottom: 1px solid rgba(201,162,39,0.4);
    box-shadow: 0 1px 0 rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.18);
    position:fixed; top:0; left:0; right:0; z-index:20;
    transition: transform 0.3s var(--ease);
  }
  header::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background: linear-gradient(90deg, transparent, var(--brass-light), transparent);
    opacity:0.55;
  }
  .header-top-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .header-top-row button{
    background:rgba(255,255,255,0.15); border:none; color:#fff;
    width:32px; height:32px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition: transform 0.1s ease, background 0.15s ease;
  }
  .header-top-row button:active{ transform: scale(0.9); background:rgba(255,255,255,0.25); }
  header .tab-title{
    flex:1; text-align:center; font-size:0.92rem; font-weight:700;
    color:#F0E4C4; letter-spacing:2.2px; text-transform:uppercase;
    font-family:'Bitter', serif;
    text-shadow: 0 1px 3px rgba(0,0,0,0.35);
  }
  .header-bottom-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:6px; font-size:0.74rem; font-weight:600; color:#F0E4C4; opacity:0.85;
  }
  .header-bottom-row #liveDay{ opacity:0.95; letter-spacing:0.5px; }

  #offlineBanner, #installBanner{
    position:fixed; left:0; right:0; z-index:19;
    display:none; align-items:center; justify-content:center; gap:10px;
    padding:8px 14px; font-size:0.78rem; font-weight:600; text-align:center;
  }
  #offlineBanner{ background:#B23B31; color:#fff; }
  #offlineBanner.show{ display:flex; }
  #installBanner{
    background: linear-gradient(160deg, var(--brass) 0%, var(--brass-deep) 100%); color:#fff;
    justify-content:space-between;
  }
  #installBanner.show{ display:flex; }
  #installBanner button{
    background:rgba(255,255,255,0.22); border:none; color:#fff; border-radius:6px;
    padding:5px 10px; font-size:0.75rem; font-weight:700; cursor:pointer; flex-shrink:0;
  }
  #dismissInstallBtn{ background:transparent !important; padding:5px !important; font-size:0.85rem !important; }

  .frame-wrap{
    position:fixed; left:0; right:0;
    top: var(--header-h, 92px);
    bottom: var(--nav-h, 64px);
    overflow:hidden;
    transition: top 0.3s ease, bottom 0.3s ease;
  }
  .frame-wrap iframe{
    position:absolute; inset:0; width:100%; height:100%; border:none;
    background: var(--paper);
  }
  .frame-wrap iframe.hidden{ display:none; }

  @keyframes tabFadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
  .tab-enter{ animation: tabFadeIn 0.28s ease; }

  .placeholder{
    position:absolute; inset:0; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px; background:var(--paper);
  }
  .placeholder.show{ display:flex; }
  .placeholder .icon{ font-size:3rem; margin-bottom:14px; }
  .placeholder h3{ font-family:'Bitter',serif; color:var(--ink-dark); margin:0 0 6px; }
  .placeholder p{ color:var(--muted); font-size:0.88rem; max-width:280px; }

  /* ============ Frame loading / error states ============ */
  .frame-status{
    position:absolute; inset:0; z-index:5; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:12px;
    text-align:center; padding:30px; background:var(--paper);
  }
  .frame-status.show{ display:flex; }
  .frame-spinner{
    width:36px; height:36px; border-radius:50%;
    border:3px solid var(--paper-line); border-top-color:var(--brass-deep);
    animation: frameSpin 0.8s linear infinite;
  }
  @keyframes frameSpin{ to{ transform:rotate(360deg); } }
  .frame-status .fs-text{ color:var(--muted); font-size:0.85rem; }
  .frame-status .fs-error-icon{ font-size:2.6rem; }
  .frame-status .fs-retry{
    background: linear-gradient(160deg, var(--brass) 0%, var(--brass-deep) 100%);
    color:#fff; border:none; border-radius:12px; padding:10px 20px;
    font-weight:600; font-size:0.85rem; cursor:pointer; margin-top:2px;
    box-shadow: 0 4px 12px rgba(138,107,20,0.3);
    transition: transform 0.1s ease;
  }
  .frame-status .fs-retry:active{ transform: scale(0.96); }

  /* ============ Native Home launcher (the "map" of the suite) ============ */
  .home-screen{
    position:absolute; inset:0; overflow-y:auto; display:none;
    background: var(--paper); padding: 24px 16px calc(30px + env(safe-area-inset-bottom));
  }
  .home-screen.show{ display:block; }
  .hs-greeting{ text-align:center; margin-bottom:26px; position:relative; }
  .hs-greeting::after{
    content:''; display:block; width:36px; height:2px; margin:14px auto 0;
    background: linear-gradient(90deg, transparent, var(--brass-deep), transparent);
  }
  .hs-firm-name{ font-family:'Bitter',serif; font-weight:800; font-size:1.32rem; color:var(--ink-dark); letter-spacing:-0.2px; }
  .hs-date{ font-size:0.78rem; color:var(--muted); margin-top:5px; letter-spacing:0.3px; }
  .hs-section-label{
    font-size:0.7rem; font-weight:700; letter-spacing:1.8px; color:var(--brass-deep);
    text-transform:uppercase; margin: 0 4px 14px;
  }
  .hs-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap:14px; align-items:stretch;
  }
  .hs-card{
    background:#fff; border:1px solid rgba(20,15,5,0.06); border-radius:var(--radius-card);
    padding:19px 17px; text-align:left; cursor:pointer;
    display:flex; flex-direction:column; gap:11px;
    box-shadow: var(--shadow-card);
    font-family:inherit; position:relative; overflow:hidden;
    transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease), border-color 0.18s ease;
  }
  .hs-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background: linear-gradient(90deg, var(--brass-deep), var(--brass) 50%, var(--brass-light));
    opacity:0; transition: opacity 0.18s ease;
  }
  .hs-card:hover::before{ opacity:1; }
  .hs-card:active{
    transform: scale(0.965);
    box-shadow: 0 1px 2px rgba(20,15,5,0.06);
    border-color: var(--brass-glow);
  }
  .hs-card-icon{
    width:48px; height:48px; border-radius:15px; color:#E8C766;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(160deg, #2b2b2b 0%, #000 100%);
    border: 1px solid rgba(201,162,39,0.4);
    box-shadow: var(--shadow-lift);
    flex-shrink:0;
  }
  .hs-card-icon svg{ width:24px; height:24px; }
  .hs-card-label{ font-weight:700; color:var(--ink-dark); font-size:0.95rem; letter-spacing:-0.1px; font-family:'Bitter',serif; }
  .hs-card-sub{ font-size:0.73rem; color:var(--muted); margin-top:-7px; letter-spacing:0.2px; }
  .hs-card.wide{ grid-column: 1 / -1; flex-direction:row; align-items:center; }
  .hs-card.wide .hs-card-icon{ flex-shrink:0; }
  .hs-card.wide::before{ width:3px; height:100%; background: linear-gradient(180deg, var(--brass-deep), var(--brass) 50%, var(--brass-light)); }

  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background: rgba(255,253,247,0.88);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-top:1px solid rgba(201,162,39,0.22);
    display:flex; flex-direction:column;
    box-shadow: 0 -8px 24px rgba(20,15,5,0.08);
    transition: transform 0.3s var(--ease);
  }
  .nav-items-row{
    display:flex; justify-content:space-around; align-items:center;
    padding: 8px 0 3px;
  }
  .firm-info-strip{
    display:flex; align-items:center; justify-content:center; gap:10px;
    text-align:left; font-size:0.66rem; color:var(--muted);
    padding: 6px 10px calc(7px + env(safe-area-inset-bottom));
    border-top:1px solid var(--paper-line);
    line-height:1.5;
  }
  .firm-info-strip img{ height:28px; width:auto; flex-shrink:0; }
  .firm-info-strip .firm-name{ font-weight:700; color:var(--ink-dark); font-family:'Bitter',serif; font-size:0.78rem; }
  .bottom-nav-item{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:0.62rem; font-weight:700; letter-spacing:0.2px; padding:6px 10px;
    transition: color 0.15s ease, transform 0.12s ease;
  }
  .bottom-nav-item:active{ transform: scale(0.9); }
  .bottom-nav-item .nav-icon{ display:flex; transition: transform 0.2s var(--ease); }
  .bottom-nav-item .nav-icon svg{ width:21px; height:21px; }
  .bottom-nav-item.active{ color: var(--brass-deep); }
  .bottom-nav-item.active .nav-icon{ transform: translateY(-2px) scale(1.1); filter: drop-shadow(0 2px 4px var(--brass-glow)); }
  .bottom-nav-item.active::before{
    content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:18px; height:3px; border-radius:2px;
    background: linear-gradient(90deg, var(--brass-deep), var(--brass));
    box-shadow: 0 0 8px var(--brass-glow);
  }

  .field{ text-align:left; margin-bottom:12px; }
  label{ display:block; font-size:0.78rem; color:var(--muted); margin-bottom:4px; }
  input{
    width:100%; padding:10px 12px; border:1px solid var(--paper-line); border-radius:10px;
    font-size:0.95rem; font-family:inherit; box-sizing:border-box;
  }
  .btn{
    background: linear-gradient(160deg, var(--brass) 0%, var(--brass-deep) 100%);
    color:#fff; border:none; border-radius:10px; padding:11px 16px;
    font-weight:600; font-size:0.9rem; cursor:pointer; width:100%;
  }
</style>
</head>
<body>

<header>
  <div class="header-top-row" style="justify-content:center;">
    <div class="tab-title" id="tabTitle">Home</div>
  </div>
  <div class="header-bottom-row">
    <span id="liveTime"></span>
    <span id="liveDay"></span>
    <span id="liveDate"></span>
  </div>
</header>

<div id="offlineBanner">📡 Internet connection nahi hai — data save/sync tab band tak rukega</div>
<div id="installBanner">
  <span>📲 Is app ko apne phone ki home screen par install karein</span>
  <button id="installBtn" type="button">Install</button>
  <button id="dismissInstallBtn" type="button" aria-label="Dismiss">✕</button>
</div>

<div id="suiteLoginOverlay" style="position:fixed; inset:0; z-index:500; overflow:hidden; background:
    radial-gradient(circle at 50% 32%, rgba(201,162,39,0.16), transparent 55%),
    linear-gradient(165deg, #17140d 0%, #0a0906 55%, #050403 100%);
    display:flex; align-items:center; justify-content:center; padding:24px;">

  <div style="position:absolute; inset:0; opacity:0.05; background-image:
      repeating-linear-gradient(45deg, #C9A227 0, #C9A227 1px, transparent 1px, transparent 26px);
      pointer-events:none;"></div>

  <div id="suiteLoginCard" style="position:relative; max-width:340px; width:100%; text-align:center;
      background:rgba(255,255,255,0.035); border:1px solid rgba(201,162,39,0.28);
      border-radius:20px; padding:34px 26px 28px; backdrop-filter:blur(6px);
      box-shadow:0 20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
      opacity:0; transform:translateY(14px) scale(0.98); transition:opacity 0.55s ease, transform 0.55s cubic-bezier(.2,.7,.3,1);">

    <div style="position:relative; width:104px; height:104px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center;">
      <div id="suiteLogoGlow" style="position:absolute; inset:-14px; border-radius:50%;
          background:radial-gradient(circle, rgba(201,162,39,0.35), transparent 70%);
          animation: suiteGlowPulse 3.2s ease-in-out infinite;"></div>
      <img src="logo-header.png" alt="Logo" style="position:relative; height:78px;width:auto;" onerror="this.style.display='none'">
    </div>

    <div style="width:34px; height:2px; background:linear-gradient(90deg, transparent, #C9A227, transparent); margin:0 auto 14px;"></div>

    <h2 style="font-family:'Bitter',serif; color:#F4EFE3; margin:0 0 3px; font-size:1.34rem; letter-spacing:0.2px;">Business Suite</h2>
    <p style="color:#9C8B5E; font-size:0.68rem; margin:0 0 16px; letter-spacing:1.6px; text-transform:uppercase;">Shree Maa Narmada Auto Mobile's &amp; Travels</p>

    <div style="display:flex; align-items:center; justify-content:center; gap:10px; color:#C9B87A; font-size:0.78rem; margin-bottom:22px; flex-wrap:wrap;">
      <span id="loginClockTime" style="font-weight:600; color:#F0D488;"></span>
      <span style="opacity:0.4;">·</span>
      <span id="loginClockDay"></span>
      <span style="opacity:0.4;">·</span>
      <span id="loginClockDate"></span>
      <span id="loginWeatherWrap" style="display:none; align-items:center; gap:4px;">
        <span style="opacity:0.4;">·</span>
        <span id="loginWeatherIcon">☀️</span>
        <span id="loginWeatherTemp"></span>
      </span>
    </div>

    <div style="position:relative; margin-bottom:12px;">
      <span style="position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#8A7A50; pointer-events:none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <input type="password" id="suitePasswordInput" placeholder="Password" style="width:100%; box-sizing:border-box; padding:12px 14px 12px 38px; border-radius:10px; border:1px solid rgba(201,162,39,0.3); background:rgba(0,0,0,0.25); color:#F4EFE3; font-size:0.95rem; transition:border-color 0.2s ease, box-shadow 0.2s ease;" onfocus="this.style.borderColor='#C9A227'; this.style.boxShadow='0 0 0 3px rgba(201,162,39,0.16)';" onblur="this.style.borderColor='rgba(201,162,39,0.3)'; this.style.boxShadow='none';">
    </div>

    <label style="display:flex; align-items:center; gap:9px; color:#B9AC85; font-size:0.8rem; margin-bottom:18px; cursor:pointer; text-align:left;">
      <input type="checkbox" id="suiteRememberMe" style="width:16px;height:16px; accent-color:#C9A227; flex-shrink:0;">
      30 din tak yaad rakhein (is device par)
    </label>

    <button id="suiteLoginBtn" type="button" style="width:100%; background:linear-gradient(160deg, #F0D488 0%, #C9A227 45%, #8A6B14 100%); color:#241c05; border:none; padding:13px; border-radius:10px; font-weight:700; font-size:1rem; cursor:pointer; box-shadow:0 6px 18px rgba(201,162,39,0.28); transition:transform 0.12s ease, box-shadow 0.12s ease; display:flex; align-items:center; justify-content:center; gap:8px;" onmousedown="this.style.transform='scale(0.97)';" onmouseup="this.style.transform='scale(1)';" onmouseleave="this.style.transform='scale(1)';">
      Login
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>

    <div id="suiteLoginError" style="color:#E8938A; font-size:0.8rem; margin-top:12px; min-height:18px;"></div>
    <div id="suiteChangePwLink" style="margin-top:16px; font-size:0.75rem; color:#8A7A50; cursor:pointer; text-decoration:underline; text-underline-offset:2px;">Password change karna hai?</div>
  </div>
</div>

<style>
@keyframes suiteGlowPulse{
  0%, 100% { opacity:0.55; transform:scale(1); }
  50% { opacity:1; transform:scale(1.08); }
}
</style>

<div id="suiteChangePwOverlay" style="position:fixed; inset:0; z-index:501; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; padding:24px;">
  <div style="max-width:340px; width:100%; background:#fff; border-radius:14px; padding:22px;">
    <h3 style="font-family:'Bitter',serif; margin-top:0;">Password Change Karein</h3>
    <div style="margin-bottom:10px;">
      <label style="font-size:0.78rem; color:#6B7280; display:block; margin-bottom:4px;">Current Password</label>
      <input type="password" id="currentPwInput" style="width:100%; box-sizing:border-box; padding:9px 10px; border-radius:8px; border:1px solid #E7E1D3;">
    </div>
    <div style="margin-bottom:10px;">
      <label style="font-size:0.78rem; color:#6B7280; display:block; margin-bottom:4px;">Naya Password</label>
      <input type="password" id="newPwInput" style="width:100%; box-sizing:border-box; padding:9px 10px; border-radius:8px; border:1px solid #E7E1D3;">
    </div>
    <div id="changePwError" style="color:#B23B31; font-size:0.8rem; margin-bottom:10px; min-height:16px;"></div>
    <div style="display:flex; gap:10px;">
      <button id="cancelChangePwBtn" type="button" style="flex:1; background:#fff; border:1px solid #141414; color:#141414; padding:10px; border-radius:8px; cursor:pointer;">Cancel</button>
      <button id="saveChangePwBtn" type="button" style="flex:1; background:linear-gradient(160deg,#D8B84A,#C9A227,#8A6B14); border:none; color:#fff; padding:10px; border-radius:8px; cursor:pointer; font-weight:600;">Save</button>
    </div>
  </div>
</div>

<div class="frame-wrap">
  <div id="homeScreen" class="home-screen show">
    <div id="backupReminderBanner" style="display:none; align-items:center; justify-content:space-between; gap:10px; background:#FBEFD8; border:1px solid var(--brass); border-radius:10px; padding:10px 12px; margin-bottom:14px; font-size:0.8rem; color:#5c4405;">
      <span></span>
      <button type="button" onclick="document.getElementById('backupAllBtn').click();" style="background:var(--brass); color:#fff; border:none; padding:6px 10px; border-radius:6px; font-size:0.75rem; cursor:pointer; flex-shrink:0;">Backup Karein</button>
    </div>
    <div class="hs-greeting">
      <div class="hs-firm-name" id="hsFirmName">—</div>
      <div class="hs-date" id="hsDate"></div>
    </div>
    <div class="hs-section-label">Your Apps</div>
    <div class="hs-grid">
      <button class="hs-card" data-goto="dashboard">
        <span class="hs-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="19" x2="6" y2="10"/><line x1="12" y1="19" x2="12" y2="5"/><line x1="18" y1="19" x2="18" y2="13"/></svg></span>
        <span class="hs-card-label">Profit &amp; Loss</span>
        <span class="hs-card-sub">Dashboard</span>
      </button>
      <button class="hs-card" data-goto="students">
        <span class="hs-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="9" rx="2"/><line x1="3" y1="12" x2="21" y2="12"/><circle cx="7.5" cy="17.4" r="1.5" fill="currentColor" stroke="none"/><circle cx="16.5" cy="17.4" r="1.5" fill="currentColor" stroke="none"/></svg></span>
        <span class="hs-card-label">Van Register</span>

<script>
// ---------- Backup All Data ----------
const BACKUP_FIREBASE_DB_URL = 'https://van-register-default-rtdb.asia-southeast1.firebasedatabase.app';
async function backupAllData(){
  const btn = document.getElementById('backupAllBtn');
  const originalLabel = btn.querySelector('.hs-card-label').textContent;
  btn.querySelector('.hs-card-label').textContent = 'Backing up…';
  btn.disabled = true;
  try{
    const keys = ['data', 'driverData', 'expenseData', 'loanData', 'sharedVehicles'];
    const result = {};
    for(const key of keys){
      try{
        const res = await fetch(`${BACKUP_FIREBASE_DB_URL}/${key}.json`);
        if(res.ok){
          const json = await res.json();
          result[key] = (json && json.value) ? JSON.parse(json.value) : null;
        } else {
          result[key] = null;
        }
      }catch(e){
        result[key] = null;
      }
    }
    const dateStr = new Date().toISOString().slice(0,10);
    const blob = new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `business-suite-backup-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    localStorage.setItem('lastBackupDate', String(Date.now()));
    updateBackupReminderBanner();
  }catch(e){
    alert('Backup mein problem hui, dobara try karein. (' + e.message + ')');
  }
  btn.querySelector('.hs-card-label').textContent = originalLabel;
  btn.disabled = false;
}
document.getElementById('backupAllBtn').addEventListener('click', backupAllData);

// ---------- Weekly backup reminder ----------
function updateBackupReminderBanner(){
  const banner = document.getElementById('backupReminderBanner');
  if(!banner) return;
  const last = Number(localStorage.getItem('lastBackupDate') || 0);
  const daysSince = last ? Math.floor((Date.now() - last) / (24*60*60*1000)) : null;
  if(daysSince === null){
    banner.querySelector('span').textContent = '📥 Abhi tak koi backup nahi liya — "Backup All Data" dabakar ek safety copy le lein.';
    banner.style.display = 'flex';
  } else if(daysSince >= 7){
    banner.querySelector('span').textContent = `📥 Aakhri backup ${daysSince} din pehle liya tha — abhi ek naya le lein.`;
    banner.style.display = 'flex';
  } else {
    banner.style.display = 'none';
  }
}
updateBackupReminderBanner();

// ---------- Automatic daily snapshot (silent, saved inside Firebase itself) ----------
// This runs quietly once a day (per device) and stores a same-day copy of every
// key under snapshots/<date>/<key> in Firebase. It exists so that even if nobody
// remembers to tap "Backup All Data", there is still always a recent restore
// point sitting safely in Firebase — this is separate from, and in addition to,
// the manual downloadable backup above.
async function autoDailySnapshot(){
  const todayStr = new Date().toISOString().slice(0,10);
  const marker = 'lastAutoSnapshotDate';
  if(localStorage.getItem(marker) === todayStr) return; // already done today from this device
  try{
    const keys = ['data', 'driverData', 'expenseData', 'loanData', 'sharedVehicles'];
    for(const key of keys){
      const res = await fetch(`${BACKUP_FIREBASE_DB_URL}/${key}.json`);
      if(!res.ok) continue;
      const json = await res.json();
      if(!json || !json.value) continue;
      await fetch(`${BACKUP_FIREBASE_DB_URL}/snapshots/${todayStr}/${key}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ value: json.value })
      });
    }
    // Light cleanup: remove the snapshot from exactly 15 days ago (keeps a rolling
    // ~2 week history without ever needing to list/enumerate old snapshot dates).
    const oldDate = new Date(Date.now() - 15*24*60*60*1000).toISOString().slice(0,10);
    fetch(`${BACKUP_FIREBASE_DB_URL}/snapshots/${oldDate}.json`, { method: 'DELETE' }).catch(()=>{});
    localStorage.setItem(marker, todayStr);
  }catch(e){
    console.log('Auto snapshot skipped (will retry next time app opens):', e);
  }
}
autoDailySnapshot();

// ---------- Business Suite login (one login for the whole suite) ----------
const SUITE_AUTH_KEY = 'suiteAuthCreds';
const SUITE_SESSION_KEY = 'suiteAuthLoggedIn';
const SUITE_REMEMBER_KEY = 'suiteAuthRememberUntil';

function getSuiteCreds(){
  try{
    const raw = localStorage.getItem(SUITE_AUTH_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.password) return parsed;
    }
  }catch(e){}
  return { password: 'narmada123' }; // default password — change it any time from the login screen
}

// The password used to live only in this device's localStorage, so changing it
// on one phone had no effect on any other phone/browser — each device kept its
// own separate copy. It's now also kept in Firebase (shared across every
// device), with localStorage as an offline-friendly cached fallback that gets
// refreshed from Firebase every time the app opens.
async function syncSuiteCredsFromFirebase(){
  try{
    const res = await fetch(`${BACKUP_FIREBASE_DB_URL}/suiteAuthConfig.json`);
    if(!res.ok) return;
    const json = await res.json();
    if(json && json.value){
      const parsed = JSON.parse(json.value);
      if(parsed && parsed.password){
        localStorage.setItem(SUITE_AUTH_KEY, JSON.stringify(parsed));
      }
    }
  }catch(e){ /* offline or unreachable — keep using the last cached password */ }
}
async function saveSuiteCredsToFirebase(creds){
  localStorage.setItem(SUITE_AUTH_KEY, JSON.stringify(creds));
  try{
    await fetch(`${BACKUP_FIREBASE_DB_URL}/suiteAuthConfig.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value: JSON.stringify(creds) })
    });
  }catch(e){ /* saved locally at least — will sync to other devices next time they're online */ }
}
syncSuiteCredsFromFirebase();

function isSuiteLoggedIn(){
  if(sessionStorage.getItem(SUITE_SESSION_KEY) === 'true') return true;
  const rememberedUntil = Number(localStorage.getItem(SUITE_REMEMBER_KEY) || 0);
  if(rememberedUntil && Date.now() < rememberedUntil){
    sessionStorage.setItem(SUITE_SESSION_KEY, 'true'); // carry through for this session too
    return true;
  }
  return false;
}

function showSuiteLogin(){
  const overlay = document.getElementById('suiteLoginOverlay');
  overlay.style.display = 'flex';
  const card = document.getElementById('suiteLoginCard');
  requestAnimationFrame(()=>{
    card.style.opacity = '1';
    card.style.transform = 'translateY(0) scale(1)';
  });
}
function hideSuiteLogin(){
  document.getElementById('suiteLoginOverlay').style.display = 'none';
}

if(isSuiteLoggedIn()){
  hideSuiteLogin();
} else {
  showSuiteLogin();
}

document.getElementById('suiteLoginBtn').addEventListener('click', async ()=>{
  // Make sure we're checking against the latest password before rejecting —
  // in case it was changed on another device since this one last opened.
  await syncSuiteCredsFromFirebase();
  const input = document.getElementById('suitePasswordInput').value;
  const creds = getSuiteCreds();
  if(input === creds.password){
    sessionStorage.setItem(SUITE_SESSION_KEY, 'true');
    if(document.getElementById('suiteRememberMe').checked){
      const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
      localStorage.setItem(SUITE_REMEMBER_KEY, String(Date.now() + thirtyDaysMs));
    }
    hideSuiteLogin();
  } else {
    document.getElementById('suiteLoginError').textContent = 'Galat password, dobara try karein.';
  }
});
document.getElementById('suitePasswordInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('suiteLoginBtn').click();
});

document.getElementById('suiteChangePwLink').addEventListener('click', ()=>{
  document.getElementById('currentPwInput').value = '';
  document.getElementById('newPwInput').value = '';
  document.getElementById('changePwError').textContent = '';
  document.getElementById('suiteChangePwOverlay').style.display = 'flex';
});
document.getElementById('cancelChangePwBtn').addEventListener('click', ()=>{
  document.getElementById('suiteChangePwOverlay').style.display = 'none';
});
document.getElementById('saveChangePwBtn').addEventListener('click', async ()=>{
  const current = document.getElementById('currentPwInput').value;
  const next = document.getElementById('newPwInput').value.trim();
  await syncSuiteCredsFromFirebase();
  const creds = getSuiteCreds();
  if(current !== creds.password){
    document.getElementById('changePwError').textContent = 'Current password galat hai.';
    return;
  }
  if(!next){
    document.getElementById('changePwError').textContent = 'Naya password likhein.';
    return;
  }
  await saveSuiteCredsToFirebase({ password: next });
  document.getElementById('suiteChangePwOverlay').style.display = 'none';
  document.getElementById('suiteLoginError').textContent = '';
  alert('Password change ho gaya — ab ye sabhi devices par kaam karega.');
});


// ---------- Tab switching (apps are embedded in this file — decoded on demand) ----------
const TAB_LABELS = { home:'Home', dashboard:'Dashboard', students:'Students', drivers:'Drivers', expenses:'Expenses', loans:'Loans' }; // icons themselves now live as inline SVG in the HTML, not here
const loadedFrames = {};
const frameLoadTimers = {};
const blobUrls = {}; // keeps object URLs around so they can be revoked on retry

function showFrameStatus(tab, mode){
  const el = document.getElementById('frame-status-' + tab);
  if(!el) return;
  if(mode === 'loading'){
    el.innerHTML = `<div class="frame-spinner"></div><div class="fs-text">${TAB_LABELS[tab] || 'App'} khul raha hai…</div>`;
    el.classList.add('show');
  } else if(mode === 'error'){
    el.innerHTML = `<div class="fs-error-icon">⚠️</div><div class="fs-text">${TAB_LABELS[tab] || 'App'} load nahi ho paya.</div><button class="fs-retry" type="button" onclick="retryFrame('${tab}')">Retry</button>`;
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

// Decodes this app's embedded (UTF-8-safe) base64 source and loads it into
// its iframe via a Blob URL — no network request needed for the app shell
// itself, since everything lives inside this one file.
function loadEmbeddedApp(tab){
  const srcEl = document.getElementById('src-' + tab);
  const frame = document.getElementById('frame-' + tab);
  if(!srcEl || !frame) return;
  try{
    const b64 = srcEl.textContent.trim();
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const html = new TextDecoder('utf-8').decode(bytes);
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    if(blobUrls[tab]) URL.revokeObjectURL(blobUrls[tab]);
    blobUrls[tab] = URL.createObjectURL(blob);
    frame.src = blobUrls[tab];
  }catch(e){
    console.error(e);
    showFrameStatus(tab, 'error');
  }
}

function retryFrame(tab){
  loadedFrames[tab] = false;
  showFrameStatus(tab, 'loading');
  armFrameTimeout(tab);
  loadEmbeddedApp(tab);
  loadedFrames[tab] = true;
}

function armFrameTimeout(tab){
  clearTimeout(frameLoadTimers[tab]);
  frameLoadTimers[tab] = setTimeout(()=>{ showFrameStatus(tab, 'error'); }, 6000);
}

// Wire up load/error handling once per iframe.
Object.keys(TAB_LABELS).filter(t=>t!=='home').forEach(tab=>{
  const frame = document.getElementById('frame-' + tab);
  if(!frame) return;
  frame.addEventListener('load', ()=>{
    clearTimeout(frameLoadTimers[tab]);
    showFrameStatus(tab, 'none');
  });
});

function activateTab(tab){
  document.querySelectorAll('.bottom-nav-item').forEach(b=>b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tabTitle').textContent = TAB_LABELS[tab] || '';

  document.querySelectorAll('.frame-wrap iframe').forEach(f=>f.classList.add('hidden'));
  document.querySelectorAll('.placeholder').forEach(p=>p.classList.remove('show'));
  document.getElementById('homeScreen').classList.remove('show');

  const animateIn = (el)=>{
    el.classList.remove('tab-enter');
    void el.offsetWidth; // force reflow so the animation restarts every time
    el.classList.add('tab-enter');
  };

  if(tab === 'home'){
    const home = document.getElementById('homeScreen');
    home.classList.add('show');
    animateIn(home);
    return;
  }

  const frame = document.getElementById('frame-' + tab);
  if(frame){
    // The Profit & Loss dashboard is a live snapshot of the other apps' data,
    // so it always needs a fresh reload (re-fetch from Firebase) every time
    // it's opened — unlike the other apps, which keep their own state alive
    // in the background and shouldn't be disrupted by a full reload.
    if(!loadedFrames[tab] || tab === 'dashboard'){
      showFrameStatus(tab, 'loading');
      armFrameTimeout(tab);
      loadEmbeddedApp(tab);
      loadedFrames[tab] = true;
    }
    frame.classList.remove('hidden');
    animateIn(frame);
  } else {
    const ph = document.getElementById('placeholder-' + tab);
    if(ph) ph.classList.add('show');
  }
}

document.getElementById('bottomNav').addEventListener('click', (e)=>{
  const btn = e.target.closest('.bottom-nav-item');
  if(!btn) return;
  navigateToTab(btn.dataset.tab);
});

// Home screen app cards jump straight to the matching tab.
document.getElementById('homeScreen').addEventListener('click', (e)=>{
  const card = e.target.closest('.hs-card');
  if(!card) return;
  navigateToTab(card.dataset.goto);
});

// ---------- Back-button handling ----------
// Without this, the phone's back button has no history to step through (since
// tab switches happen entirely in JS, not as real page navigations), so a
// single back-press would close the whole app immediately. This gives every
// tab switch a history entry, so back always returns to Home first, and
// pressing back again from Home needs a second confirming press before it
// actually exits.
let currentTab = 'home';
let lastBackPressTime = 0;

function navigateToTab(tab){
  if(tab === currentTab) return;
  history.pushState({ tab }, '', '');
  currentTab = tab;
  activateTab(tab);
}

window.addEventListener('popstate', (e)=>{
  const tab = (e.state && e.state.tab) || 'home';
  if(tab === 'home' && currentTab === 'home'){
    const now = Date.now();
    if(now - lastBackPressTime < 2000){
      return; // second press within 2s — let the browser actually exit/close
    }
    lastBackPressTime = now;
    showExitToast();
    history.pushState({ tab: 'home' }, '', ''); // re-arm so a single press never exits
    return;
  }
  currentTab = tab;
  activateTab(tab);
});

function showExitToast(){
  let el = document.getElementById('exitToast');
  if(!el){
    el = document.createElement('div');
    el.id = 'exitToast';
    el.style.cssText = 'position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:rgba(20,20,20,0.92); color:#fff; padding:10px 18px; border-radius:20px; font-size:0.85rem; z-index:600; opacity:0; transition:opacity 0.2s ease;';
    el.textContent = 'Exit karne ke liye dobara back dabayein';
    document.body.appendChild(el);
  }
  el.style.opacity = '1';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(()=>{ el.style.opacity = '0'; }, 1800);
}

history.replaceState({ tab: 'home' }, '', '');
history.pushState({ tab: 'home' }, '', ''); // pre-arm one entry so the first back press is always caught

activateTab('home'); syncFrameOffsets();

// ---------- Keep frame offsets correct (header/bottom-nav always visible) ----------
function syncFrameOffsets(){
  const headerH = document.querySelector('header').offsetHeight;
  const navH = document.getElementById('bottomNav').offsetHeight;
  const offlineEl = document.getElementById('offlineBanner');
  const installEl = document.getElementById('installBanner');
  offlineEl.style.top = headerH + 'px';
  const offlineH = offlineEl.classList.contains('show') ? offlineEl.offsetHeight : 0;
  installEl.style.top = (headerH + offlineH) + 'px';
  const installH = installEl.classList.contains('show') ? installEl.offsetHeight : 0;
  document.documentElement.style.setProperty('--header-h', (headerH + offlineH + installH) + 'px');
  document.documentElement.style.setProperty('--nav-h', navH + 'px');
}
window.addEventListener('resize', syncFrameOffsets);

// ---------- Offline indicator ----------
function updateOfflineBanner(){
  document.getElementById('offlineBanner').classList.toggle('show', !navigator.onLine);
  syncFrameOffsets();
}
window.addEventListener('online', updateOfflineBanner);
window.addEventListener('offline', updateOfflineBanner);
updateOfflineBanner();

// ---------- "Add to Home Screen" install prompt ----------
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(navigator.onLine && localStorage.getItem('installBannerDismissed') !== 'true'){
    document.getElementById('installBanner').classList.add('show');
    syncFrameOffsets();
  }
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
  syncFrameOffsets();
});
document.getElementById('dismissInstallBtn').addEventListener('click', ()=>{
  document.getElementById('installBanner').classList.remove('show');
  localStorage.setItem('installBannerDismissed', 'true');
  syncFrameOffsets();
});
window.addEventListener('appinstalled', ()=>{
  document.getElementById('installBanner').classList.remove('show');
  syncFrameOffsets();
});

// ---------- Firm info footer (pulled once from Van Register's data) ----------
async function loadFirmInfo(){
  const textEl = document.getElementById('firmInfoText');
  const logoEl = document.getElementById('firmLogo');
  try{
    const res = await fetch('https://van-register-default-rtdb.asia-southeast1.firebasedatabase.app/data.json');
    const data = await res.json();
    const parsed = data && data.value ? JSON.parse(data.value) : null;
    const biz = parsed && parsed.business;
    if(!biz || !biz.name){ textEl.textContent = ''; syncFrameOffsets(); return; }
    const parts = [];
    if(biz.regNo) parts.push('Reg No: ' + biz.regNo);
    if(biz.gst) parts.push('GSTIN: ' + biz.gst);
    if(biz.phone) parts.push('☎ ' + biz.phone);
    textEl.innerHTML = `<span class="firm-name">${biz.name}</span>` + (parts.length ? '<br>' + parts.join(' · ') : '');
    logoEl.style.display = 'block';
    document.getElementById('hsFirmName').textContent = biz.name;
  }catch(e){
    textEl.textContent = '';
  }
  syncFrameOffsets();
}
loadFirmInfo();

// ---------- Live time & date ----------
function updateClock(){
  const now = new Date();
  document.getElementById('liveTime').textContent = now.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  document.getElementById('liveDay').textContent = now.toLocaleDateString('en-IN', { weekday:'long' });
  document.getElementById('liveDate').textContent = now.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  document.getElementById('hsDate').textContent = now.toLocaleDateString('en-IN', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });

  const loginTime = document.getElementById('loginClockTime');
  if(loginTime){
    loginTime.textContent = now.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('loginClockDay').textContent = now.toLocaleDateString('en-IN', { weekday:'short' });
    document.getElementById('loginClockDate').textContent = now.toLocaleDateString('en-IN', { day:'2-digit', month:'short' });
  }
}
updateClock();
setInterval(updateClock, 1000);

// ---------- Weather on the login screen (no API key needed) ----------
function weatherIconFor(code){
  if(code === 0) return '☀️';
  if(code <= 2) return '🌤️';
  if(code === 3) return '☁️';
  if(code >= 45 && code <= 48) return '🌫️';
  if(code >= 51 && code <= 67) return '🌦️';
  if(code >= 71 && code <= 77) return '🌨️';
  if(code >= 80 && code <= 82) return '🌧️';
  if(code >= 95) return '⛈️';
  return '🌡️';
}
function loadLoginWeather(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    try{
      const { latitude, longitude } = pos.coords;
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code`);
      if(!res.ok) return;
      const data = await res.json();
      const temp = Math.round(data.current.temperature_2m);
      const code = data.current.weather_code;
      const wrap = document.getElementById('loginWeatherWrap');
      document.getElementById('loginWeatherIcon').textContent = weatherIconFor(code);
      document.getElementById('loginWeatherTemp').textContent = temp + '°C';
      wrap.style.display = 'inline-flex';
    }catch(e){ /* weather is a nice-to-have — fail silently */ }
  }, ()=>{ /* location denied — just skip the weather */ }, { timeout: 5000 });
}
loadLoginWeather();
</script>
